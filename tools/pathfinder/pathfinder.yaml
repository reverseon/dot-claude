server:
  name: local-knowledgebase
  version: 1.0.0

sources:
  - name: programming
    type: markdown
    path: /knowledgebase/programming
    file_patterns:
      - "**/*.md"
      - "**/*.mdx"
    chunk:
      target_tokens: 600
      overlap_tokens: 50

tools:
  - name : search-programming-knowledgebase
    type: search
    description: Search General Programming Knowledgebase
    source: programming
    default_limit: 5
    max_limit: 20
    result_format: docs

  - name: explore-programming-knowledgebase
    type: bash
    description: Explore General Programming Knowledgebase
    sources: [programming]
    bash:
      session_state: true
      grep_strategy: hybrid
  
embedding:
  provider: ollama
  model: nomic-embed-text
  dimensions: 768
  base_url: http://localhost:11434

indexing:
  auto_reindex: true
  reindex_hour_utc: 3
  stale_threshold_hours: 24
